name: Android Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag = 项目名+版本号, e.g. 小乌龟1.1（不可重复，发新版请递增版本号）; blank = 小乌龟<versionName>-yyyyMMddHHmm"
        required: false
        type: string
      release_channel:
        description: "Release channel, auto uses beta on fongmi-sync"
        required: false
        default: auto
        type: choice
        options:
          - auto
          - stable
          - beta
      release_notes:
        description: "Release notes, use \\n for Markdown newlines"
        required: false
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  TZ: Asia/Shanghai

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Verify bundled MPV native assets
        run: bash scripts/verify_mpv_native_assets.sh --require-elf

      - name: Install Android packages
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Run WebSocket danmaku tests
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:testMobileArm64_v8aDebugUnitTest \
            --tests 'com.fongmi.android.tv.player.danmaku.*' \
            --no-daemon

      - name: Resolve release tag
        id: meta
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
          INPUT_CHANNEL: ${{ inputs.release_channel }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          # 版本基线：version.properties 优先（正式版构建自动递增的持久基线），回退解析 build.gradle 字面量
          VERSION_NAME="$(sed -n 's/^versionName=//p' version.properties 2>/dev/null | head -1 | tr -d '[:space:]')"
          VERSION_CODE="$(sed -n 's/^versionCode=//p' version.properties 2>/dev/null | head -1 | tr -d '[:space:]')"
          if [ -z "$VERSION_NAME" ]; then
            VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -1)"
          fi
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -1)"
          fi
          CHANNEL="$INPUT_CHANNEL"
          if [ "$CHANNEL" = "auto" ] || [ -z "$CHANNEL" ]; then
            if [ "$BRANCH_NAME" = "fongmi-sync" ]; then
              CHANNEL="beta"
            else
              CHANNEL="stable"
            fi
          fi
          # tag 格式：项目名+版本号（如 小乌龟1.1），可带 -yyyyMMddHHmm 时间后缀；beta 通道带时间防互相覆盖
          if [ "$CHANNEL" = "beta" ]; then
            APK_SUFFIX="-beta"
            TAG_PATTERN="^小乌龟[0-9]+(\.[0-9]+)*-beta-[0-9]{12}$"
            TAG_DEFAULT="小乌龟${VERSION_NAME}-beta-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="小乌龟1.1-beta-202609101530"
          else
            APK_SUFFIX=""
            TAG_PATTERN="^小乌龟[0-9]+(\.[0-9]+)*(-[0-9]{12})?$"
            TAG_DEFAULT="小乌龟${VERSION_NAME}-$(date +%Y%m%d%H%M)"
            TAG_EXPECT="小乌龟1.1 或 小乌龟1.1-202609101530"
          fi
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            TAG="$TAG_DEFAULT"
          fi
          if ! printf '%s' "$TAG" | grep -Eq "$TAG_PATTERN"; then
            echo "::error title=Invalid release tag::格式应为 项目名+版本号（例如 $TAG_EXPECT），收到: $TAG"
            exit 1
          fi
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error title=Release tag exists::$TAG 已发布过，版本号不可覆盖，请递增（如 $TAG → 下一版）"
            exit 1
          fi
          # URL 百分号编码后的 tag（中文等非 ASCII 字符在下载链接/API 中必须编码）
          TAG_ENCODED="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$TAG")"
          {
            echo "tag=$TAG"
            echo "tag_encoded=$TAG_ENCODED"
            echo "title=$TAG"
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
            echo "channel=$CHANNEL"
            echo "apk_suffix=$APK_SUFFIX"
          } >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KS_BASE64="${RELEASE_KEYSTORE_BASE64:-$KEYSTORE_BASE64}"
          STORE_PASSWORD="${RELEASE_STORE_PASSWORD:-$KEY_PASSWORD}"
          ALIAS="${RELEASE_KEY_ALIAS:-$KEY_ALIAS}"
          KEY_PASS="${RELEASE_KEY_PASSWORD:-$STORE_PASSWORD}"
          if [ -z "$KS_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$ALIAS" ]; then
            echo "::error title=Release signing not configured::Configure RELEASE_KEYSTORE_BASE64, RELEASE_KEY_ALIAS and RELEASE_STORE_PASSWORD in repository secrets."
            exit 1
          fi
          mkdir -p app/signing
          printf '%s' "$KS_BASE64" | base64 --decode > app/signing/release.jks
          {
            echo "storeFile=$GITHUB_WORKSPACE/app/signing/release.jks"
            echo "keyAlias=$ALIAS"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyPassword=$KEY_PASS"
          } > local.properties
          echo "Release signing configured"

      - name: Build four release APKs
        env:
          WEBHTV_RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          WEBHTV_APK_SUFFIX: ${{ steps.meta.outputs.apk_suffix }}
        run: |
          chmod +x ./gradlew
          rm -rf Release/apk
          ./gradlew \
            -PversionBump=false \
            :app:assembleMobileArm64_v8aRelease \
            :app:assembleMobileArmeabi_v7aRelease \
            :app:assembleLeanbackArm64_v8aRelease \
            :app:assembleLeanbackArmeabi_v7aRelease \
            --no-daemon

      - name: Collect artifacts
        run: |
          rm -rf dist
          mkdir -p dist
          cp Release/apk/*.apk dist/
          ls -lh dist/

      - name: Prepare release notes input
        id: release_notes
        env:
          RELEASE_NOTES_RAW: ${{ inputs.release_notes }}
        run: |
          python3 - <<'PY'
          import os

          raw = os.environ.get("RELEASE_NOTES_RAW", "").strip()
          notes = (
              raw
              .replace("\\r\\n", "\n")
              .replace("\\n", "\n")
              .replace("\\t", "\t")
              .replace('\\"', '"')
              .replace("\\'", "'")
          )
          delimiter = "RELEASE_NOTES_EOF"
          while delimiter in notes:
              delimiter += "_"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_notes={'true' if notes else 'false'}\n")
              fh.write(f"notes<<{delimiter}\n")
              fh.write(notes)
              if notes and not notes.endswith("\n"):
                  fh.write("\n")
              fh.write(f"{delimiter}\n")
          PY

      - name: Generate update manifests
        env:
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_RELEASE_DOWNLOAD_BASE: https://github.com/${{ github.repository }}/releases/download/${{ steps.meta.outputs.tag_encoded }}
        run: |
          python3 - <<'PY'
          import glob
          import hashlib
          import json
          import os

          tag = os.environ["RELEASE_TAG"]
          notes = os.environ.get("RELEASE_NOTES", "").strip()
          release_download_base = os.environ["GITHUB_RELEASE_DOWNLOAD_BASE"]
          for apk in glob.glob("dist/*.apk"):
              base = os.path.splitext(os.path.basename(apk))[0]
              with open(apk, "rb") as fh:
                  content = fh.read()
              data = {
                  "name": tag,
                  "desc": f"{tag} - ${{ steps.meta.outputs.short_sha }}",
                  "channel": "${{ steps.meta.outputs.channel }}",
                  "code": int("${{ steps.meta.outputs.version_code }}"),
                  "apk": f"{release_download_base}/{base}.apk",
                  "size": len(content),
                  "sha256": hashlib.sha256(content).hexdigest(),
              }
              if notes:
                  data["notes"] = notes
              with open(f"dist/{base}.json", "w", encoding="utf-8") as fh:
                  json.dump(data, fh, ensure_ascii=False, indent=2)
                  fh.write("\n")
          PY
          ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ steps.release_notes.outputs.notes }}
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.prerelease }}" = "true" ] || [ "${{ steps.meta.outputs.channel }}" = "beta" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          NOTES="${RELEASE_NOTES:-手动触发 GitHub Actions 构建发布。}"
          gh release create "${{ steps.meta.outputs.tag }}" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.meta.outputs.title }}" \
            --notes "$NOTES" \
            $PRERELEASE_FLAG \
            dist/*.apk dist/*.json

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webhtv-${{ steps.meta.outputs.tag }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
